name: Build and Check

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Astro Check for Node.js 24
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm check

      - name: Run author archive importer tests
        run: pnpm test:archive

      - name: Run Astro migration regression tests
        run: pnpm test:migration

      - name: Verify imported author-master content when present
        shell: bash
        run: |
          if [[ -f provenance/tai-song/manifest.json ]]; then
            pnpm archive:verify
          else
            echo "No archive manifest exists yet; importer tests cover the empty foundation."
          fi

  build:
    runs-on: ubuntu-latest
    name: Astro Build for Node.js 24
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm build

      - name: Verify built routes and metadata
        run: pnpm verify:site

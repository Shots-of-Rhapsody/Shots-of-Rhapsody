name: Deploy Astro to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Deploy the approved release or the isolated public review build
        required: true
        type: choice
        default: review
        options:
          - review
          - release
      expected_sha:
        description: Full 40-character commit SHA required for a public review deployment
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify selected Pages artifact
    if: >-
      (inputs.deployment_mode == 'release' && github.ref == 'refs/heads/main') ||
      (inputs.deployment_mode == 'review' && github.ref == 'refs/heads/codex/v1.0-integration')
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      SHOTS_BUILD_MODE: ${{ inputs.deployment_mode == 'review' && 'public-review' || 'release' }}
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Confirm the release commit is the current main tip
        if: inputs.deployment_mode == 'release'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Confirm the review commit and branch tip
        if: inputs.deployment_mode == 'review'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          expected_sha_normalized="${EXPECTED_SHA,,}"
          test "${GITHUB_REF}" = "refs/heads/codex/v1.0-integration"
          test "${GITHUB_SHA}" = "${expected_sha_normalized}"
          test "$(git rev-parse HEAD)" = "${expected_sha_normalized}"
          git fetch --no-tags origin \
            '+refs/heads/codex/v1.0-integration:refs/remotes/origin/codex/v1.0-integration'
          test "$(git rev-parse refs/remotes/origin/codex/v1.0-integration)" = "${expected_sha_normalized}"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the author archive importer
        run: pnpm test:archive

      - name: Test future writing and podcast boundaries
        run: pnpm test:future-content

      - name: Test Astro content route migration
        run: pnpm test:migration

      - name: Test release audit tooling
        run: pnpm test:release-tools

      - name: Verify the complete committed archive
        run: pnpm archive:verify --require-complete

      - name: Verify complete approved writing and podcast evidence
        if: inputs.deployment_mode == 'release'
        run: |
          pnpm content:verify --require-complete
          pnpm medium:verify --require-complete
          pnpm podcast:verify --require-complete

      - name: Verify public-review writing and podcast sources
        if: inputs.deployment_mode == 'review'
        run: |
          pnpm medium:verify --require-complete
          pnpm podcast:verify

      - name: Run non-writing lint
        run: pnpm lint:ci

      - name: Run Astro type checking
        run: pnpm type-check

      - name: Build the production site
        run: pnpm build

      - name: Verify routes, feeds, metadata, and human signoff
        if: inputs.deployment_mode == 'release'
        run: pnpm verify:release

      - name: Verify the isolated public-review artifact
        if: inputs.deployment_mode == 'review'
        run: pnpm verify:review

      - name: Verify complete built podcast publication boundary
        if: inputs.deployment_mode == 'release'
        run: pnpm podcast:verify --require-complete --with-built

      - name: Install the pinned Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production browser and accessibility tests
        run: pnpm test:e2e

      - name: Upload privacy-verified browser screenshots
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.deployment_mode == 'release' && 'playwright-release-evidence' || 'playwright-public-review-evidence' }}
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Audit the complete dependency graph
        shell: bash
        run: |
          pnpm audit --json > dependency-audit.json || true
          node scripts/release/verify-dependency-audit.mjs dependency-audit.json

      - name: Snapshot and synchronize every public Git ref
        shell: bash
        run: |
          snapshot_remote_refs() {
            git ls-remote origin | LC_ALL=C sort
          }
          snapshot_remote_refs > "${RUNNER_TEMP}/public-refs-before.txt"
          awk '
            $2 == "HEAD" { next }
            $2 ~ /^refs\/heads\// { next }
            $2 ~ /^refs\/tags\// { next }
            $2 ~ /^refs\/notes\// { next }
            $2 ~ /^refs\/pull\/[0-9]+\/(head|merge)$/ { next }
            { exit 1 }
          ' "${RUNNER_TEMP}/public-refs-before.txt"
          git fetch --prune --prune-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --prune --no-tags origin \
            '+refs/pull/*/head:refs/remotes/audit-pull-head/*' \
            '+refs/pull/*/merge:refs/remotes/audit-pull-merge/*'
          git fetch --prune --no-tags origin \
            '+refs/notes/*:refs/remotes/audit-notes/*'
          snapshot_remote_refs > "${RUNNER_TEMP}/public-refs-fetched.txt"
          cmp --silent \
            "${RUNNER_TEMP}/public-refs-before.txt" \
            "${RUNNER_TEMP}/public-refs-fetched.txt"

      - name: Scan complete reachable history with checksum-verified Gitleaks
        id: gitleaks
        continue-on-error: true
        run: node scripts/release/run-gitleaks.mjs --report "${{ runner.temp }}/gitleaks-report.json"

      - name: Run independent publication disclosure audit
        run: >-
          node scripts/release/audit-repository.mjs
          --gitleaks-report "${{ runner.temp }}/gitleaks-report.json"
          --output "${{ runner.temp }}/public-release-audit.json"

      - name: Require successful Gitleaks execution
        if: always()
        shell: bash
        run: test "${{ steps.gitleaks.outcome }}" = "success"

      - name: Reconfirm the audited public ref set is unchanged
        shell: bash
        run: |
          git ls-remote origin | LC_ALL=C sort \
            > "${RUNNER_TEMP}/public-refs-after.txt"
          cmp --silent \
            "${RUNNER_TEMP}/public-refs-before.txt" \
            "${RUNNER_TEMP}/public-refs-after.txt"

      - name: Upload redacted disclosure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.deployment_mode == 'release' && 'public-disclosure-release-evidence' || 'public-disclosure-review-evidence' }}
          path: |
            ${{ runner.temp }}/gitleaks-report.json
            ${{ runner.temp }}/public-release-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Check patch whitespace
        run: git diff --check HEAD^

      - name: Reconfirm the verified commit is still the main tip
        if: inputs.deployment_mode == 'release'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Reconfirm the verified review commit is still the branch tip
        if: inputs.deployment_mode == 'review'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          expected_sha_normalized="${EXPECTED_SHA,,}"
          git fetch --no-tags origin \
            '+refs/heads/codex/v1.0-integration:refs/remotes/origin/codex/v1.0-integration'
          test "$(git rev-parse HEAD)" = "${expected_sha_normalized}"
          test "$(git rev-parse refs/remotes/origin/codex/v1.0-integration)" = "${expected_sha_normalized}"

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy verified Pages artifact
    needs: build
    if: >-
      (inputs.deployment_mode == 'release' && github.ref == 'refs/heads/main') ||
      (inputs.deployment_mode == 'review' && github.ref == 'refs/heads/codex/v1.0-integration')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the dispatched release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Require the dispatched commit to remain the main tip
        if: inputs.deployment_mode == 'release'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Require the dispatched review commit to remain the branch tip
        if: inputs.deployment_mode == 'review'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          expected_sha_normalized="${EXPECTED_SHA,,}"
          test "${GITHUB_REF}" = "refs/heads/codex/v1.0-integration"
          test "${GITHUB_SHA}" = "${expected_sha_normalized}"
          test "$(git rev-parse HEAD)" = "${expected_sha_normalized}"
          git fetch --no-tags origin \
            '+refs/heads/codex/v1.0-integration:refs/remotes/origin/codex/v1.0-integration'
          test "$(git rev-parse refs/remotes/origin/codex/v1.0-integration)" = "${expected_sha_normalized}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  production-smoke:
    name: Verify the deployed production site
    needs: deploy
    if: >-
      (inputs.deployment_mode == 'release' && github.ref == 'refs/heads/main') ||
      (inputs.deployment_mode == 'review' && github.ref == 'refs/heads/codex/v1.0-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: UTC
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      SHOTS_BUILD_MODE: ${{ inputs.deployment_mode == 'review' && 'public-review' || 'release' }}
    steps:
      - name: Checkout the deployed test contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for the deployed Pages URL
        shell: bash
        run: |
          expected_url="https://shots-of-rhapsody.github.io/Shots-of-Rhapsody/"
          normalized_url="${PLAYWRIGHT_BASE_URL%/}/"
          if [ "${normalized_url}" != "${expected_url}" ]; then
            echo "The Pages deployment returned an unexpected URL" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_BASE_URL=${normalized_url}" >> "${GITHUB_ENV}"

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --output /dev/null \
              "${PLAYWRIGHT_BASE_URL}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Pages did not become available after 30 attempts" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Run production browser and accessibility smoke tests
        run: pnpm test:e2e

      - name: Upload privacy-verified deployment screenshots
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.deployment_mode == 'release' && 'playwright-production-evidence' || 'playwright-public-review-production-evidence' }}
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 14

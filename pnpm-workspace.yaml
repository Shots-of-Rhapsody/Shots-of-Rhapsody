autoInstallPeers: false

# pnpm 11 build-script policy: allow required native/tool installs only.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
# Temporary audit remediations for transitive parents with stale ranges.
overrides:
  nanoid@<3.3.18: ^3.3.18
  'picomatch@2.3.1': 2.3.2
  postcss@<=8.5.22: ^8.5.23
minimumReleaseAgeExclude:
  - postcss@8.5.23
  - fast-uri@3.1.5
  - js-yaml@4.3.1
  - nanoid@3.3.18
